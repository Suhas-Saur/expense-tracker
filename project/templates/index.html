<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1 class="title">Student Expense Tracker</h1>
            <p class="subtitle">Track your daily expenses effortlessly and manage your budget wisely</p>
        </header>

        <!-- Main Card -->
        <div class="card">
            <!-- Add Expense Form -->
            <section class="form-section">
                <h2 class="section-title">Add New Expense</h2>
                <form id="expenseForm" class="expense-form">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="">Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Books">Books</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                    
                    <button type="submit" class="btn-primary">Add Expense</button>
                </form>
                
                <div id="message" class="message"></div>
            </section>

            <!-- Expenses Table -->
            <section class="table-section">
                <h2 class="section-title">Your Expenses</h2>
                <div class="table-wrapper">
                    <table class="expense-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Amount (₹)</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBody">
                            <tr class="no-data">
                                <td colspan="3">No expenses recorded yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Total Summary -->
            <section class="summary-section">
                <div class="total-card">
                    <span class="total-label">Total Expenses</span>
                    <span class="total-amount">₹<span id="totalAmount">0.00</span></span>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Built with ❤️ for students | College Project 2026</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
